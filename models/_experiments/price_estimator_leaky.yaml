# The version of the price model that looks best offline and must never ship:
# it uses the number of bids (known only after the auction), joins features
# without point-in-time correctness, and evaluates on a random split.
name: price_estimator_leaky
description: Deliberately leaky variant used to demonstrate the pre-ship review.
owner: pricing
task: regression
prediction_point: listing
entities_sql: ../price_estimator/entities.sql
point_in_time: false
features:
  - listing.make_model
  - listing.segment
  - listing.fuel
  - listing.seller_country
  - listing.age_months
  - listing.mileage_km
  - listing.km_per_month
  - listing.damage_score
  - listing.power_kw
  - model_market_90d.median_price_90d
  - model_market_90d.median_age_months_90d
  - model_market_90d.median_km_90d
  - model_market_90d.volume_90d
  - segment_market_28d.median_price_28d
  - segment_market_28d.price_trend_28d
  - seller_90d.price_to_start_90d
  - auction_outcome.n_bids
estimator:
  max_iter: 500
  learning_rate: 0.06
  log_target: true
split:
  kind: random
  train_start: 2025-03-01
  cutoff: 2025-11-01
  test_end: 2026-01-01
metrics: [mape, median_ape, within_10pct, mae]
baseline: model_market_90d.median_price_90d
slices: [listing.fuel]
gate:
  primary_metric: mape
  direction: lower
  threshold: 0.10
